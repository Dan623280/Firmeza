name: firmeza
services:
  tests:
    build:
      context: ./backend
      dockerfile: tests/Firmeza.Tests/Dockerfile
    restart: "no"
  db:
    image: postgres:18-alpine
    depends_on:
      tests:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: firmeza
      POSTGRES_USER: firmeza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firmeza -d firmeza"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: ./backend
      dockerfile: src/Firmeza.API/Dockerfile
    depends_on:
      tests:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=firmeza;Username=firmeza;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Configura JWT_KEY en .env}
      Jwt__Issuer: Firmeza
      Jwt__Audience: Firmeza.Client
      Seed__AdminEmail: ${ADMIN_EMAIL:?Configura ADMIN_EMAIL en .env}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      Seed__DemoData: ${SEED_DEMO_DATA:-true}
      AllowedOrigins__0: http://localhost:${CLIENT_PORT:-4200}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Licenses__StudentName: ${STUDENT_NAME:-Proyecto academico Firmeza}
      Licenses__EPPlus: ${EPPLUS_LICENSE:-}
      Licenses__AutoMapper: ${AUTOMAPPER_LICENSE:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - receipts:/app/wwwroot/recibos
    restart: unless-stopped
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      tests:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-4200}:8080"
    restart: unless-stopped
volumes:
  postgres_data:
  receipts:
