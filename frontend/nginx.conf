server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 location = /health { access_log off; default_type text/plain; return 200 'healthy'; }
 location /api/ {
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:8080;
  proxy_pass $api_upstream$request_uri;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
  client_max_body_size 10m;
 }
 location / { try_files $uri $uri/ /index.html; }
 location = /index.html { add_header Cache-Control "no-store"; }
 location ~* \.(?:js|css)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
